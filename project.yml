name: MiniRetro
options:
  bundleIdPrefix: com.miniretro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MiniRetro:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
          # .metal 不参与编译：Xcode 26+ 的 Metal 编译器为独立可选组件
          # （MetalToolchain），未安装会导致 xcodebuild 直接失败。
          # 实际 shader 在 App/Game/VideoShaders.swift 中运行时编译。
          - "**/*.metal"
      - path: CoreBridge
        excludes:
          - "**/*.h"
    dependencies:
      # 四个 libretro core（Cores/artifacts 下由 build_cores.sh 产出 xcframework）
      # 注意：CoreBridge 是编译进主 target 的源码，不是 framework 依赖
      - framework: Cores/artifacts/mgba-core.xcframework
        embed: true
        codeSignOnCopy: false
      - framework: Cores/artifacts/sameboy-core.xcframework
        embed: true
        codeSignOnCopy: false
      - framework: Cores/artifacts/fceumm-core.xcframework
        embed: true
        codeSignOnCopy: false
      # FBNeo：街机（CPS1/CPS2/Neo Geo/PGM）——西游释厄传、三国战纪、拳皇
      - framework: Cores/artifacts/fbneo-core.xcframework
        embed: true
        codeSignOnCopy: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miniretro.app
        PRODUCT_NAME: MiniRetro
        INFOPLIST_FILE: App/Info.plist
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: App/MiniRetro-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/CoreBridge
        # 单 target 编译需要显式允许 ObjC++ 源文件参与（XcodeGen 默认已包含）
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/CoreBridge
        # 单 target 编译需要显式允许 ObjC++ 源文件参与（XcodeGen 默认已包含）
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        SWIFT_OBJC_INTERFACE_HEADER_NAME: MiniRetro-Swift.h
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.9"
        CURRENT_PROJECT_VERSION: "10"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CLANG_ENABLE_MODULES: YES
        # 模拟器构建时需要允许未签名/adhoc（Tools/build.sh 控制）
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # 资源目录（AppIcon / AccentColor）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # 桥接层单测（M1 验证 save/load 往返）
  MiniRetroTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/MiniRetroTests
    dependencies:
      - target: MiniRetro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miniretro.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MiniRetro.app/MiniRetro"
